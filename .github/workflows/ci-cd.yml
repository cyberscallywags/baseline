name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v2

      - name: 🧰 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚡ Install UV (Astral)
        run: |
          pip install uv

      

      - name: 📦 Sync dependencies
        run: |
          uv sync

      - name: 🧹 Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

      - name: ✅ Run tests (pytest if present)
        run: |
          uv run task test_run

      
      - name: 🐳 Build Docker image
        run: |
          docker build -t fastapi-uv-app .

      - name: 🚀 Test Docker image startup
        run: |
          docker run -d -p 8000:8000 fastapi-uv-app
          sleep 5
          curl -f http://localhost:8000 || (docker logs $(docker ps -q) && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: itestedthis1/github_wf_service:latest
